name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure Firebase Hosting release retention
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPIDER_AAA19 }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check google-auth requests
          python3 - <<'PY'
          import json, os, sys, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          raw = os.environ.get("FIREBASE_SERVICE_ACCOUNT_JSON", "")
          if not raw:
              raise SystemExit("Missing FIREBASE_SERVICE_ACCOUNT_SPIDER_AAA19")

          info = json.loads(raw)
          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/cloud-platform"],
          )
          creds.refresh(Request())

          headers = {
              "Authorization": f"Bearer {creds.token}",
              "Content-Type": "application/json",
          }
          url = "https://firebasehosting.googleapis.com/v1beta1/sites/spider-aaa19/channels/live"
          resp = requests.patch(
              url,
              params={"updateMask": "retainedReleaseCount"},
              headers=headers,
              json={"name": "sites/spider-aaa19/channels/live", "retainedReleaseCount": 1},
              timeout=60,
          )
          print("retention status:", resp.status_code)
          if not resp.ok:
              print(resp.text)
              resp.raise_for_status()

          data = resp.json()
          print("retainedReleaseCount:", data.get("retainedReleaseCount"))
          PY

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPIDER_AAA19 }}
          channelId: live
          projectId: spider-aaa19
