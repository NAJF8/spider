<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="bgGrad_Samsung990PRO2TB" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#24242c"/>
            <stop offset="100%" stop-color="#0f0f13"/>
        </radialGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="400" height="300" rx="16" fill="url(#bgGrad_Samsung990PRO2TB)"/>
    <rect x="1" y="1" width="398" height="298" rx="15" stroke="#2c2c36" stroke-width="2"/>
    
    <!-- Spider Najaf Watermark -->
    <text x="375" y="30" fill="#333340" font-family="Cairo, sans-serif" font-weight="900" font-size="12" text-anchor="end">SPIDER NAJAF</text>
    
    <!-- Category / Feature Tag -->
    <rect x="20" y="16" width="90" height="24" rx="12" fill="#FF1744" fill-opacity="0.15"/>
    <text x="65" y="32" fill="#FF1744" font-family="Cairo, sans-serif" font-weight="800" font-size="11" text-anchor="middle">تخزين</text>

    <!-- Component Graphic -->
    <g filter="url(#glow)">
        
            <rect x="110" y="125" width="180" height="50" rx="4" fill="#1e1e24" stroke="#FF1744" stroke-width="3"/>
            <rect x="110" y="125" width="25" height="50" rx="2" fill="#333" stroke="#555"/>
            <rect x="150" y="135" width="60" height="30" rx="3" fill="#111"/>
            <rect x="225" y="135" width="45" height="30" rx="3" fill="#111"/>
            <text x="180" y="154" fill="#FF1744" font-family="Cairo, sans-serif" font-weight="800" font-size="12" text-anchor="middle">NVMe</text>
            <text x="247" y="154" fill="#fff" font-family="Cairo, sans-serif" font-weight="700" font-size="10" text-anchor="middle">2TB</text>
        
    </g>

    <!-- Product Text Footer -->
    <text x="200" y="260" fill="#ffffff" font-family="Cairo, sans-serif" font-weight="800" font-size="16" text-anchor="middle">Samsung 990 PRO 2TB</text>
    <text x="200" y="280" fill="#888899" font-family="Cairo, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Read: 7450 MB/s • Write: 6900 MB/s</text>
</svg>