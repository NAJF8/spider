<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="bgGrad_ASUSTUFGamingB650PLUS" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#24242c"/>
            <stop offset="100%" stop-color="#0f0f13"/>
        </radialGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="400" height="300" rx="16" fill="url(#bgGrad_ASUSTUFGamingB650PLUS)"/>
    <rect x="1" y="1" width="398" height="298" rx="15" stroke="#2c2c36" stroke-width="2"/>
    
    <!-- Spider Najaf Watermark -->
    <text x="375" y="30" fill="#333340" font-family="Cairo, sans-serif" font-weight="900" font-size="12" text-anchor="end">SPIDER NAJAF</text>
    
    <!-- Category / Feature Tag -->
    <rect x="20" y="16" width="90" height="24" rx="12" fill="#E6A100" fill-opacity="0.15"/>
    <text x="65" y="32" fill="#E6A100" font-family="Cairo, sans-serif" font-weight="800" font-size="11" text-anchor="middle">لوحات أم</text>

    <!-- Component Graphic -->
    <g filter="url(#glow)">
        
            <rect x="100" y="70" width="200" height="160" rx="8" fill="#18181f" stroke="#E6A100" stroke-width="4"/>
            <rect x="130" y="90" width="60" height="60" rx="4" fill="#252530" stroke="#555" stroke-width="2"/>
            <rect x="220" y="90" width="15" height="90" rx="2" fill="#333" stroke="#E6A100" stroke-width="1"/>
            <rect x="245" y="90" width="15" height="90" rx="2" fill="#333" stroke="#E6A100" stroke-width="1"/>
            <rect x="120" y="170" width="150" height="16" rx="3" fill="#2a2a35" stroke="#444"/>
            <text x="160" y="125" fill="#E6A100" font-family="Cairo, sans-serif" font-weight="800" font-size="12" text-anchor="middle">SOCKET</text>
        
    </g>

    <!-- Product Text Footer -->
    <text x="200" y="260" fill="#ffffff" font-family="Cairo, sans-serif" font-weight="800" font-size="16" text-anchor="middle">ASUS TUF Gaming B650-PLUS</text>
    <text x="200" y="280" fill="#888899" font-family="Cairo, sans-serif" font-weight="600" font-size="12" text-anchor="middle">AM5 Socket • Realtek 2.5Gb • USB 3.2 Gen 2x2</text>
</svg>