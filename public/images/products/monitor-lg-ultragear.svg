        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="400" height="300" rx="16" fill="url(#bgGrad_LGUltraGear27QHD)"/>
    <rect x="1" y="1" width="398" height="298" rx="15" stroke="#2c2c36" stroke-width="2"/>
    
    <!-- Spider Najaf Watermark -->
    <text x="375" y="30" fill="#333340" font-family="Cairo, sans-serif" font-weight="900" font-size="12" text-anchor="end">SPIDER NAJAF</text>
    
    <!-- Category / Feature Tag -->
    <rect x="20" y="16" width="90" height="24" rx="12" fill="#9C27B0" fill-opacity="0.15"/>
    <text x="65" y="32" fill="#9C27B0" font-family="Cairo, sans-serif" font-weight="800" font-size="11" text-anchor="middle">شاشات</text>

    <!-- Component Graphic -->
    <g filter="url(#glow)">
        
            <rect x="90" y="70" width="220" height="135" rx="6" fill="#1a1a22" stroke="#9C27B0" stroke-width="3"/>
            <rect x="100" y="80" width="200" height="115" rx="3" fill="#0c0c12"/>
            <polygon points="185,205 215,205 210,230 190,230" fill="#333"/>
