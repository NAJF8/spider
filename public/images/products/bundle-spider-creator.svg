<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="bgGrad_SPIDERCREATORPC" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#24242c"/>
            <stop offset="100%" stop-color="#0f0f13"/>
        </radialGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="400" height="300" rx="16" fill="url(#bgGrad_SPIDERCREATORPC)"/>
    <rect x="1" y="1" width="398" height="298" rx="15" stroke="#2c2c36" stroke-width="2"/>
    
    <!-- Spider Najaf Watermark -->
    <text x="375" y="30" fill="#333340" font-family="Cairo, sans-serif" font-weight="900" font-size="12" text-anchor="end">SPIDER NAJAF</text>
    
    <!-- Category / Feature Tag -->
    <rect x="20" y="16" width="90" height="24" rx="12" fill="#4285F4" fill-opacity="0.15"/>
    <text x="65" y="32" fill="#4285F4" font-family="Cairo, sans-serif" font-weight="800" font-size="11" text-anchor="middle">تجميعات تصميم</text>

    <!-- Component Graphic -->
    <g filter="url(#glow)">
        
            <rect x="120" y="70" width="160" height="165" rx="10" fill="#181820" stroke="#4285F4" stroke-width="4"/>
            <circle cx="160" cy="115" r="22" fill="#111" stroke="#4285F4" stroke-width="2"/>
            <circle cx="160" cy="165" r="22" fill="#111" stroke="#4285F4" stroke-width="2"/>
            <rect x="205" y="95" width="55" height="90" rx="6" fill="#252532" stroke="#444"/>
            <text x="232" y="145" fill="#4285F4" font-family="Cairo, sans-serif" font-weight="900" font-size="14" text-anchor="middle">PC</text>
        
    </g>

    <!-- Product Text Footer -->
    <text x="200" y="260" fill="#ffffff" font-family="Cairo, sans-serif" font-weight="800" font-size="16" text-anchor="middle">تجميعة SPIDER CREATOR PC</text>
    <text x="200" y="280" fill="#888899" font-family="Cairo, sans-serif" font-weight="600" font-size="12" text-anchor="middle">RTX 4070 • 2TB NVMe • Liquid Cooler 360mm</text>
</svg>