<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="bgGrad_GeForceRTX4070TiSUPER" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#24242c"/>
            <stop offset="100%" stop-color="#0f0f13"/>
        </radialGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="400" height="300" rx="16" fill="url(#bgGrad_GeForceRTX4070TiSUPER)"/>
    <rect x="1" y="1" width="398" height="298" rx="15" stroke="#2c2c36" stroke-width="2"/>
    
    <!-- Spider Najaf Watermark -->
    <text x="375" y="30" fill="#333340" font-family="Cairo, sans-serif" font-weight="900" font-size="12" text-anchor="end">SPIDER NAJAF</text>
    
    <!-- Category / Feature Tag -->
    <rect x="20" y="16" width="90" height="24" rx="12" fill="#76B900" fill-opacity="0.15"/>
    <text x="65" y="32" fill="#76B900" font-family="Cairo, sans-serif" font-weight="800" font-size="11" text-anchor="middle">كروت شاشة</text>

    <!-- Component Graphic -->
    <g filter="url(#glow)">
        
            <rect x="80" y="90" width="240" height="120" rx="10" fill="#1e1e24" stroke="#76B900" stroke-width="4"/>
            <circle cx="140" cy="150" r="38" fill="#111" stroke="#76B900" stroke-width="3" stroke-dasharray="8,4"/>
            <circle cx="200" cy="150" r="38" fill="#111" stroke="#76B900" stroke-width="3" stroke-dasharray="8,4"/>
            <circle cx="260" cy="150" r="38" fill="#111" stroke="#76B900" stroke-width="3" stroke-dasharray="8,4"/>
            <text x="200" y="156" fill="#fff" font-family="Cairo, sans-serif" font-weight="900" font-size="14" text-anchor="middle">RTX</text>
        
    </g>

    <!-- Product Text Footer -->
    <text x="200" y="260" fill="#ffffff" font-family="Cairo, sans-serif" font-weight="800" font-size="16" text-anchor="middle">GeForce RTX 4070 Ti SUPER</text>
    <text x="200" y="280" fill="#888899" font-family="Cairo, sans-serif" font-weight="600" font-size="12" text-anchor="middle">DLSS 3.5 • Ray Tracing • 256-bit Bus</text>
</svg>