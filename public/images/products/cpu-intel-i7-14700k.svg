<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="bgGrad_IntelCorei714700K" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#24242c"/>
            <stop offset="100%" stop-color="#0f0f13"/>
        </radialGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="400" height="300" rx="16" fill="url(#bgGrad_IntelCorei714700K)"/>
    <rect x="1" y="1" width="398" height="298" rx="15" stroke="#2c2c36" stroke-width="2"/>
    
    <!-- Spider Najaf Watermark -->
    <text x="375" y="30" fill="#333340" font-family="Cairo, sans-serif" font-weight="900" font-size="12" text-anchor="end">SPIDER NAJAF</text>
    
    <!-- Category / Feature Tag -->
    <rect x="20" y="16" width="90" height="24" rx="12" fill="#0071C5" fill-opacity="0.15"/>
    <text x="65" y="32" fill="#0071C5" font-family="Cairo, sans-serif" font-weight="800" font-size="11" text-anchor="middle">معالجات</text>

    <!-- Component Graphic -->
    <g filter="url(#glow)">
        
            <rect x="130" y="80" width="140" height="140" rx="12" fill="#1e1e24" stroke="#0071C5" stroke-width="4"/>
            <rect x="155" y="105" width="90" height="90" rx="8" fill="#111" stroke="#444" stroke-width="2"/>
            <text x="200" y="145" fill="#0071C5" font-family="Cairo, sans-serif" font-weight="900" font-size="20" text-anchor="middle">CPU</text>
            <text x="200" y="170" fill="#aaa" font-family="Cairo, sans-serif" font-weight="700" font-size="12" text-anchor="middle">LGA1700 • 20C/28T</text>
            <circle cx="140" cy="90" r="3" fill="#0071C5"/>
        
    </g>

    <!-- Product Text Footer -->
    <text x="200" y="260" fill="#ffffff" font-family="Cairo, sans-serif" font-weight="800" font-size="16" text-anchor="middle">Intel Core i7-14700K</text>
    <text x="200" y="280" fill="#888899" font-family="Cairo, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Up to 5.6 GHz • Intel Smart Cache 33MB</text>
</svg>