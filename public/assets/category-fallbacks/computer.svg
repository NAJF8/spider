<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <rect width="160" height="160" rx="80" fill="#fff7f7"/>
  <!-- Monitor Display Frame -->
  <rect x="22" y="38" width="76" height="52" rx="6" fill="none" stroke="#222a35" stroke-width="5" stroke-linecap="round"/>
  <!-- Screen Display Accent in Red -->
  <path d="M30 76 L48 58 L62 70 L72 60 L88 74" fill="none" stroke="#ed1c24" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Monitor Stand -->
  <path d="M60 90v14" stroke="#222a35" stroke-width="5" stroke-linecap="round"/>
  <path d="M44 104h32" stroke="#ed1c24" stroke-width="5" stroke-linecap="round"/>
  <!-- Desktop Tower Chassis -->
  <rect x="106" y="32" width="32" height="74" rx="6" fill="none" stroke="#222a35" stroke-width="5" stroke-linecap="round"/>
  <!-- Tower Power Button -->
  <circle cx="122" cy="44" r="3.5" fill="#ed1c24"/>
  <!-- Tower Port Slot -->
  <line x1="114" y1="54" x2="130" y2="54" stroke="#222a35" stroke-width="3" stroke-linecap="round"/>
  <!-- Tower RGB Grille Accents in Red -->
  <line x1="113" y1="68" x2="131" y2="68" stroke="#ed1c24" stroke-width="4" stroke-linecap="round"/>
  <line x1="113" y1="78" x2="131" y2="78" stroke="#ed1c24" stroke-width="4" stroke-linecap="round"/>
  <line x1="113" y1="88" x2="131" y2="88" stroke="#ed1c24" stroke-width="4" stroke-linecap="round"/>
  <!-- Keyboard in Line-art -->
  <rect x="28" y="114" width="64" height="12" rx="3" fill="none" stroke="#222a35" stroke-width="4"/>
  <line x1="46" y1="120" x2="74" y2="120" stroke="#ed1c24" stroke-width="3" stroke-linecap="round"/>
  <!-- Mouse -->
  <rect x="98" y="114" width="10" height="14" rx="4" fill="none" stroke="#ed1c24" stroke-width="3"/>
</svg>
