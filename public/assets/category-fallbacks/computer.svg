<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background subtle circle, similar to some icons -->
  <circle cx="100" cy="100" r="85" fill="#fff2f3" opacity="0.4" />
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Monitor Outline -->
    <rect x="30" y="40" width="140" height="90" rx="12" stroke="#ed1c24" stroke-width="12" />
    <!-- Screen content line -->
    <line x1="50" y1="100" x2="150" y2="100" stroke="#1d222b" stroke-width="8" />
    <!-- Stand -->
    <path d="M80 130 L70 170 M120 130 L130 170" stroke="#1d222b" stroke-width="12" />
    <!-- Base -->
    <line x1="50" y1="170" x2="150" y2="170" stroke="#ed1c24" stroke-width="12" />

  </g>
</svg>