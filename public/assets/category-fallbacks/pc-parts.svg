<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <rect width="160" height="160" rx="80" fill="#fff7f7"/>
  <!-- Motherboard Outer Edge -->
  <rect x="30" y="30" width="100" height="100" rx="8" fill="none" stroke="#222a35" stroke-width="5" stroke-linecap="round"/>
  <!-- Corner Mounting Holes -->
  <circle cx="40" cy="40" r="3" fill="#222a35"/>
  <circle cx="120" cy="40" r="3" fill="#222a35"/>
  <circle cx="40" cy="120" r="3" fill="#222a35"/>
  <circle cx="120" cy="120" r="3" fill="#222a35"/>
  <!-- CPU Socket in Center (Red Line) -->
  <rect x="56" y="48" width="46" height="46" rx="5" fill="none" stroke="#ed1c24" stroke-width="5"/>
  <!-- CPU Die inside -->
  <rect x="67" y="59" width="24" height="24" rx="3" fill="none" stroke="#222a35" stroke-width="3.5"/>
  <circle cx="79" cy="71" r="4" fill="#ed1c24"/>
  <!-- VRM Circuit Traces on Left -->
  <path d="M44 54h5m-5 8h5m-5 8h5m-5 8h5m-5 8h5" stroke="#ed1c24" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Top Capacitor Pins -->
  <path d="M66 41v4m13-4v4m13-4v4" stroke="#222a35" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Dual RAM Slots on Right -->
  <line x1="110" y1="48" x2="110" y2="94" stroke="#ed1c24" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="117" y1="48" x2="117" y2="94" stroke="#222a35" stroke-width="3.5" stroke-linecap="round"/>
  <!-- PCIe x16 Slot below CPU -->
  <rect x="44" y="104" width="72" height="10" rx="3" fill="none" stroke="#222a35" stroke-width="4"/>
  <line x1="68" y1="104" x2="68" y2="114" stroke="#ed1c24" stroke-width="3"/>
  <line x1="50" y1="109" x2="64" y2="109" stroke="#ed1c24" stroke-width="2.5"/>
  <line x1="72" y1="109" x2="110" y2="109" stroke="#ed1c24" stroke-width="2.5"/>
</svg>
