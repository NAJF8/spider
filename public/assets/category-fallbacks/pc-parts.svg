<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background subtle circle, similar to some icons -->
  <circle cx="100" cy="100" r="85" fill="#effaf4" opacity="0.9" />
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- CPU/Chip Outline -->
    <rect x="50" y="50" width="100" height="100" rx="12" stroke="#1f8f4c" stroke-width="12" />
    <!-- Inner square -->
    <rect x="75" y="75" width="50" height="50" rx="6" stroke="#1d222b" stroke-width="10" />
    <!-- Pins top -->
    <line x1="70" y1="50" x2="70" y2="35" stroke="#1d222b" stroke-width="10" />
    <line x1="100" y1="50" x2="100" y2="35" stroke="#1d222b" stroke-width="10" />
    <line x1="130" y1="50" x2="130" y2="35" stroke="#1d222b" stroke-width="10" />
    <!-- Pins bottom -->
    <line x1="70" y1="150" x2="70" y2="165" stroke="#1d222b" stroke-width="10" />
    <line x1="100" y1="150" x2="100" y2="165" stroke="#1d222b" stroke-width="10" />
    <line x1="130" y1="150" x2="130" y2="165" stroke="#1d222b" stroke-width="10" />
    <!-- Pins left -->
    <line x1="50" y1="70" x2="35" y2="70" stroke="#1f8f4c" stroke-width="10" />
    <line x1="50" y1="100" x2="35" y2="100" stroke="#1f8f4c" stroke-width="10" />
    <line x1="50" y1="130" x2="35" y2="130" stroke="#1f8f4c" stroke-width="10" />
    <!-- Pins right -->
    <line x1="150" y1="70" x2="165" y2="70" stroke="#1f8f4c" stroke-width="10" />
    <line x1="150" y1="100" x2="165" y2="100" stroke="#1f8f4c" stroke-width="10" />
    <line x1="150" y1="130" x2="165" y2="130" stroke="#1f8f4c" stroke-width="10" />

  </g>
</svg>
