<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background subtle circle, similar to some icons -->
  <circle cx="100" cy="100" r="85" fill="#fff2f3" opacity="0.4" />
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- UPS Outline -->
    <rect x="60" y="40" width="80" height="120" rx="10" stroke="#1d222b" stroke-width="12" />
    <!-- Display -->
    <rect x="75" y="60" width="50" height="30" rx="4" stroke="#1f8f4c" stroke-width="10" />
    <!-- Power Button -->
    <circle cx="100" cy="120" r="10" stroke="#1f8f4c" stroke-width="10" />
    <!-- Line accent -->
    <line x1="75" y1="145" x2="125" y2="145" stroke="#1d222b" stroke-width="10" />

  </g>
</svg>
