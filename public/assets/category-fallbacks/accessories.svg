<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <rect width="160" height="160" rx="80" fill="#fff7f7"/>
  <!-- Headband Outer Arc (Dominant Red Line) -->
  <path d="M42 82 C42 46, 59 34, 80 34 C101 34, 118 46, 118 82" fill="none" stroke="#ed1c24" stroke-width="8" stroke-linecap="round"/>
  <!-- Headband Comfort Cushion (Dark Accent) -->
  <path d="M58 44 C65 40, 72 38, 80 38 C88 38, 95 40, 102 44" fill="none" stroke="#27303b" stroke-width="5" stroke-linecap="round"/>
  <!-- Adjustment Sliders -->
  <rect x="37" y="72" width="10" height="12" rx="3" fill="#27303b"/>
  <rect x="113" y="72" width="10" height="12" rx="3" fill="#27303b"/>
  <!-- Left Earcup -->
  <rect x="30" y="80" width="24" height="40" rx="8" fill="#27303b"/>
  <rect x="35" y="85" width="14" height="30" rx="5" fill="#ed1c24"/>
  <!-- Right Earcup -->
  <rect x="106" y="80" width="24" height="40" rx="8" fill="#27303b"/>
  <rect x="111" y="85" width="14" height="30" rx="5" fill="#ed1c24"/>
  <!-- Microphone Boom -->
  <path d="M44 114 C44 130, 58 138, 76 138" fill="none" stroke="#27303b" stroke-width="5" stroke-linecap="round"/>
  <!-- Mic Head -->
  <rect x="74" y="132" width="16" height="12" rx="5" fill="#ed1c24"/>
  <line x1="78" y1="138" x2="86" y2="138" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Sound wave accents in center -->
  <path d="M71 76 C75 72, 85 72, 89 76" fill="none" stroke="#ed1c24" stroke-width="4" stroke-linecap="round"/>
  <path d="M65 67 C72 60, 88 60, 95 67" fill="none" stroke="#27303b" stroke-width="4" stroke-linecap="round"/>
</svg>
