  <!-- Gaming Mouse on Right -->
  <rect x="92" y="96" width="28" height="42" rx="14" fill="none" stroke="#222a35" stroke-width="4.5"/>
  <line x1="106" y1="96" x2="106" y2="112" stroke="#222a35" stroke-width="3"/>
  <rect x="104" y="101" width="4" height="8" rx="2" fill="#ed1c24"/>
