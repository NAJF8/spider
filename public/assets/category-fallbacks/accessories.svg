  <rect x="33" y="78" width="8" height="24" rx="4" fill="#ed1c24"/>
  <!-- Right Earcup -->
  <rect x="108" y="72" width="18" height="36" rx="7" fill="none" stroke="#222a35" stroke-width="5"/>
  <rect x="113" y="78" width="8" height="24" rx="4" fill="#ed1c24"/>
